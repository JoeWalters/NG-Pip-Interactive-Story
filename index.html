<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; touch-action: manipulation; }
  body {
    font-family: -apple-system, "SF Pro Rounded", "Comic Sans MS", "Chalkboard SE", "Arial Rounded MT Bold", sans-serif;
    background: #fdf6e3;
  }
  #book { position: relative; width: 100%; height: 100%; }

  /* ---------- Pages ---------- */
  .page {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center; align-items: center;
    transition: opacity .35s ease;
  }
  .page.active { display: flex; }
  .scene { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; }
  .scene svg { width: 100%; height: 100%; }

  /* Background tints */
  .bg-day { background: linear-gradient(180deg,#9ed9ff 0%, #cfe9ff 45%, #ffe9b8 100%); }
  .bg-dusk { background: linear-gradient(180deg,#ffd9a8 0%, #ffc3d4 45%, #b7a7ff 100%); }
  .bg-night { background: linear-gradient(180deg,#2b2b5e 0%, #4b3a7e 45%, #6b4a8e 100%); }
  .bg-cover { background: radial-gradient(circle at 50% 20%, #ffe9b8 0%, #9ed9ff 55%, #7bc6ff 100%); }

  /* ---------- Title & text ---------- */
  h1.title {
    position: absolute; top: 4vh; left: 0; right: 0; margin: 0 auto;
    width: max-content; text-align: center;
    font-size: clamp(64px, 14vw, 150px);
    font-weight: 900; letter-spacing: 2px;
    color: #fff; text-shadow: 0 4px 0 #c96b1e, 0 8px 16px rgba(0,0,0,.28);
    pointer-events: auto; cursor: pointer; z-index: 5;
  }
  .story {
    position: absolute; bottom: 3vh; left: 0; right: 0; margin: 0 auto;
    max-width: 880px;
    padding: 12px 24px;
    background: rgba(255,255,255,.93);
    border-radius: 22px;
    box-shadow: 0 10px 26px rgba(0,0,0,.20);
    text-align: center; z-index: 6; pointer-events: none;
  }
  .story p {
    margin: .25em auto; max-width: 820px;
    font-size: clamp(18px, 3.2vw, 34px); line-height: 1.22; font-weight: 700;
    color: #5a3a16;
  }

  /* ---------- Play button (green, no label) ---------- */
  #playBtn {
    position: absolute; bottom: 5vh; left: 50%; transform: translateX(-50%);
    z-index: 8; cursor: pointer;
    display: flex; justify-content: center; align-items: center;
    width: clamp(88px, 16vw, 132px); height: clamp(88px, 16vw, 132px);
    font-size: clamp(34px, 7vw, 54px); font-weight: 900; line-height: 1;
    color: #fff; background: #4caf50;
    border: none; border-radius: 50%;
    box-shadow: 0 6px 0 #2e8b3e, 0 12px 24px rgba(0,0,0,.28);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  #playBtn:active { transform: translateX(-50%) translateY(4px); box-shadow: 0 2px 0 #2e8b3e, 0 6px 14px rgba(0,0,0,.24); }

  /* ---------- Navigation ---------- */
  .navbtn {
    position: absolute; z-index: 9; cursor: pointer;
    width: clamp(64px, 13vw, 100px); height: clamp(64px, 13vw, 100px);
    border-radius: 50%; border: none;
    font-size: clamp(34px, 7vw, 56px); font-weight: 900; line-height: 1;
    color: #7c4a12; background: rgba(255,255,255,.82);
    box-shadow: 0 5px 12px rgba(0,0,0,.22);
  }
  .navbtn:active { transform: translateY(3px); }
  #backBtn { left: 3vw; bottom: 5vh; }
  #nextBtn { right: 3vw; bottom: 5vh; }
  #nextBtn.restart { color: #fff; background: #ff9d2c; }
  .dots {
    position: absolute; bottom: 3vh; left: 0; right: 0;
    display: flex; justify-content: center; gap: 2vw; z-index: 9;
  }
  .dot { width: clamp(12px,2.4vw,18px); height: clamp(12px,2.4vw,18px); border-radius: 50%; background: rgba(255,255,255,.55); border: 2px solid rgba(124,74,18,.35); cursor: pointer; }
  .dot.on { background: #ff9d2c; border-color: #b25e14; }

  /* ---------- Animations ---------- */
  .pip-wrap { transform-box: fill-box; transform-origin: 50% 100%; cursor: pointer; }
  @keyframes wiggle { 0%{transform:rotate(0)} 18%{transform:rotate(-8deg) translateX(-7px)} 36%{transform:rotate(8deg) translateX(7px)} 54%{transform:rotate(-5deg) translateX(-3px)} 72%{transform:rotate(4deg) translateX(2px)} 100%{transform:rotate(0)} }
  .wiggle { animation: wiggle .85s ease-in-out; }

  .acorn { transform-box: fill-box; transform-origin: 50% 0; cursor: pointer; }
  @keyframes fall { 0%{transform:translateY(0) rotate(0)} 60%{transform:translateY(240px) rotate(24deg)} 100%{transform:translateY(300px) rotate(48deg) scale(.9)} }
  .falling { animation: fall .7s ease-in; }
  @keyframes respawn { 0%{transform:scale(0) rotate(0)} 65%{transform:scale(1.18) rotate(-10deg)} 100%{transform:scale(1) rotate(0)} }
  .respawn { animation: respawn .6s ease-out; }

  @keyframes floatCloud { 0%{transform:translateX(0)} 50%{transform:translateX(24px)} 100%{transform:translateX(0)} }
  .cloud { animation: floatCloud 9s ease-in-out infinite; }

  /* Sun rays pop out */
  .sun-wrap { cursor: pointer; }
  .sun-rays { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; transform: scale(0); transition: opacity .45s ease, transform .45s ease; }
  @keyframes popRays { 0%{transform:scale(0); opacity:0} 45%{transform:scale(1.2); opacity:1} 62%{transform:scale(.9); opacity:1} 75%{transform:scale(1.06); opacity:1} 100%{transform:scale(1); opacity:1} }
  .sun-rays.on { opacity:1; transform: scale(1); animation: popRays .75s ease-out; }

  /* Clouds rain when tapped */
  .cloud-wrap { cursor: pointer; }
  .cloud-wrap .raindrops { opacity: 0; }
  @keyframes cloudRain { 0%{opacity:0} 12%{opacity:1} 78%{opacity:1} 100%{opacity:0} }
  @keyframes cloudDrop { 0%{transform:translateY(0); opacity:1} 75%{opacity:1} 100%{transform:translateY(230px); opacity:0} }
  .cloud-wrap.raining .raindrops { opacity:1; animation: cloudRain 1.5s ease-in-out; }
  .cloud-wrap.raining .raindrops use { animation: cloudDrop .85s linear infinite; }

  @keyframes rainFall { 0%{transform:translateY(0); opacity:1} 80%{opacity:1} 100%{transform:translateY(330px); opacity:0} }
  .raindrop { animation: rainFall 1.6s linear infinite; }

  @keyframes twinkle { 0%{opacity:.35; transform:scale(.8)} 50%{opacity:1; transform:scale(1.15)} 100%{opacity:.35; transform:scale(.8)} }
  .star { animation: twinkle 2.6s ease-in-out infinite; }

  @keyframes bob { 0%{transform:translateY(0)} 50%{transform:translateY(-12px)} 100%{transform:translateY(0)} }
  .bob { animation: bob 2.4s ease-in-out infinite; }

  /* Title balloons up then back to normal */
  @keyframes balloon { 0%{transform:scale(1)} 35%{transform:scale(1.45)} 55%{transform:scale(1.2)} 70%{transform:scale(1.28)} 85%{transform:scale(1.05)} 100%{transform:scale(1)} }
  .balloon { animation: balloon .95s ease-in-out; }

  /* Tree leaves rustle */
  .tree-wrap { transform-box: fill-box; transform-origin: 50% 100%; cursor: pointer; }
  @keyframes rustle { 0%{transform:rotate(0)} 15%{transform:rotate(-1.7deg) translateX(-3px)} 30%{transform:rotate(1.5deg) translateX(3px)} 45%{transform:rotate(-1.1deg)} 60%{transform:rotate(.9deg)} 75%{transform:rotate(-.5deg)} 100%{transform:rotate(0)} }
  .tree-wrap.rustle { animation: rustle .7s ease-in-out; }

  /* Bugs in the tree: wiggle on tap */
  .bug { transform-box: fill-box; transform-origin: 50% 50%; cursor: pointer; }
  @keyframes bugWiggle { 0%{transform:rotate(0) scale(1)} 20%{transform:rotate(-16deg) scale(1.15)} 45%{transform:rotate(14deg) scale(1.1)} 70%{transform:rotate(-7deg) scale(1)} 100%{transform:rotate(0) scale(1)} }
  .bug.bwiggle { animation: bugWiggle .55s ease-in-out; }

  /* Pip's face (page 1): wave on tap */
  .pipface { transform-box: fill-box; transform-origin: 50% 50%; cursor: pointer; }
  @keyframes wave { 0%{transform:rotate(0)} 20%{transform:rotate(-11deg)} 45%{transform:rotate(10deg)} 70%{transform:rotate(-5deg)} 100%{transform:rotate(0)} }
  .pipface.wave { animation: wave .8s ease-in-out; }

  /* Fireflies glow */
  @keyframes glowPulse { 0%{opacity:.6} 50%{opacity:1} 100%{opacity:.6} }
  .glow { animation: glowPulse 1.4s ease-in-out infinite; }

  /* Spider drops down on its web (web appears below him) and comes back up */
  .spiderbug { transform-box: fill-box; transform-origin: 50% 0; cursor: pointer; }
  .spiderweb { opacity: 0; }
  @keyframes spiderDrop { 0%{transform:translateY(0)} 35%{transform:translateY(260px)} 60%{transform:translateY(260px)} 100%{transform:translateY(0)} }
  .spiderbug.drop { animation: spiderDrop 1.8s ease-in-out; }
  @keyframes webShow { 0%{opacity:0} 12%{opacity:1} 80%{opacity:1} 100%{opacity:0} }
  .spiderweb.show { animation: webShow 1.8s ease-in-out; }

  /* Firefly flies in a circle */
  @keyframes flyCircle { 0%{transform:translate(0,0)} 25%{transform:translate(110px,-70px)} 50%{transform:translate(0,-150px)} 75%{transform:translate(-110px,-70px)} 100%{transform:translate(0,0)} }
  .flycircle { animation: flyCircle 1.5s ease-in-out; }

  /* Butterfly & firefly float forwards and backwards */
  @keyframes floatFB { 0%{transform:scale(.9)} 50%{transform:scale(1.14)} 100%{transform:scale(.9)} }
  .floatFB { animation: floatFB 2.6s ease-in-out infinite; }

  /* Ladybugs fly toward and away from each other (playing tag) */
  @keyframes tagA { 0%{transform:translate(0,0)} 30%{transform:translate(240px,20px)} 45%{transform:translate(240px,20px)} 100%{transform:translate(0,0)} }
  .tagA { animation: tagA 2.4s ease-in-out infinite; }
  @keyframes tagB { 0%{transform:translate(0,0)} 30%{transform:translate(-240px,20px)} 45%{transform:translate(-240px,20px)} 100%{transform:translate(0,0)} }
  .tagB { animation: tagB 2.4s ease-in-out infinite; }

  /* Clickable leaves: crunch + disappear */
  .clickleaf { transform-box: fill-box; transform-origin: 50% 50%; cursor: pointer; }
  @keyframes leafGone { 0%{opacity:1; transform:scale(1)} 60%{opacity:.85; transform:scale(1.16)} 100%{opacity:0; transform:scale(0)} }
  .clickleaf.gone { animation: leafGone .45s ease-in forwards; }

  /* Pip bites the big leaf */
  .pipbite { transform-box: fill-box; transform-origin: 50% 50%; cursor: pointer; }
  .bigleaf { transform-box: fill-box; transform-origin: 50% 50%; cursor: pointer; }
  @keyframes eat { 0%{transform:translate(0,0) rotate(0)} 20%{transform:translate(18px,-10px) rotate(10deg)} 35%{transform:translate(0,0) rotate(0)} 50%{transform:translate(18px,-10px) rotate(10deg)} 65%{transform:translate(0,0) rotate(0)} 80%{transform:translate(18px,-10px) rotate(10deg)} 100%{transform:translate(0,0) rotate(0)} }
  .pipbite.eat { animation: eat .7s ease-in-out; }

  /* Page 5: Pip grows rounder as leaves disappear */
  .piggrow { transform-box: fill-box; transform-origin: 50% 100%; cursor: pointer; }
  .piggrow.eat { animation: eat .7s ease-in-out; }
  .p5leaf { transform-box: fill-box; transform-origin: 50% 50%; cursor: pointer; }
  .p5leaf.gone { animation: leafGone .45s ease-in forwards; }
  .butterfly5 { transform-box: fill-box; transform-origin: 50% 50%; cursor: pointer; }
  @keyframes butterflyFB { 0%{transform:translateX(0)} 25%{transform:translateX(130px)} 50%{transform:translateX(0)} 75%{transform:translateX(-130px)} 100%{transform:translateX(0)} }
  .butterfly5.fly { animation: butterflyFB 1.6s ease-in-out; }

  /* Storm: darken + rain + lightning */
  .stormcloud { cursor: pointer; }
  .stormoverlay { opacity: 0; pointer-events: none; transition: opacity .6s ease; }
  .stormoverlay.on { opacity: .55; }
  @keyframes lightningFlash { 0%{opacity:0} 5%{opacity:.95} 10%{opacity:0} 15%{opacity:.85} 22%{opacity:0} 28%{opacity:.7} 35%{opacity:0} }
  .lightning { opacity: 0; pointer-events: none; }
  .lightning.flash { animation: lightningFlash 1.3s ease-out; }
  .stormrain { opacity: 0; pointer-events: none; transition: opacity .6s ease; }
  @keyframes stormDrop { 0%{transform:translateY(0); opacity:1} 80%{opacity:1} 100%{transform:translateY(420px); opacity:0} }
  .stormrain.on { opacity: 1; }
  .stormrain.on use { animation: stormDrop 1.1s linear infinite; }

  /* Page 5 ladybugs fly toward the screen and away (like page 7) */
  @keyframes towardAway { 0%{transform:scale(.82)} 50%{transform:scale(1.16)} 100%{transform:scale(.82)} }
  .ladybug5 { transform-box: fill-box; transform-origin: 50% 50%; animation: towardAway 2.6s ease-in-out infinite; }

  /* Page 6 cocoon wiggles */
  .cocoon { transform-box: fill-box; transform-origin: 50% 50%; cursor: pointer; }
  @keyframes cocoonWiggle { 0%{transform:rotate(0)} 20%{transform:rotate(-7deg)} 45%{transform:rotate(6deg)} 70%{transform:rotate(-3deg)} 100%{transform:rotate(0)} }
  .cocoon.wiggle { animation: cocoonWiggle .7s ease-in-out; }

  /* Page 6 stars stay still; clicking makes them fall like rain, then return */
  .star6 { transform-box: fill-box; transform-origin: 50% 0; cursor: pointer; }
  @keyframes starFall { 0%{transform:translateY(0)} 15%{transform:translateY(260px)} 75%{transform:translateY(260px)} 100%{transform:translateY(0)} }
  .star6.fall { animation: starFall 3s ease-in-out; }

  /* Page 7: Pip turns into a butterfly and flies around */
  .pip7 { transform-box: fill-box; transform-origin: 50% 50%; cursor: pointer; }
  .pip7.hidden { opacity: 0; }
  .pipfly7 { transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; pointer-events: none; }
  @keyframes pipFlyAround { 0%{transform:translate(0,0)} 15%{transform:translate(160px,-80px)} 30%{transform:translate(40px,-200px)} 45%{transform:translate(-120px,-120px)} 60%{transform:translate(-60px,60px)} 75%{transform:translate(120px,40px)} 90%{transform:translate(80px,-100px)} 100%{transform:translate(0,0)} }
  .pipfly7.fly { opacity: 1; animation: pipFlyAround 3.5s ease-in-out; }

  /* Butterfly flies around */
  .butterfly { transform-box: fill-box; transform-origin: 50% 50%; cursor: pointer; }
  @keyframes flyAround { 0%{transform:translate(0,0)} 20%{transform:translate(120px,-60px)} 40%{transform:translate(40px,-160px)} 60%{transform:translate(-90px,-90px)} 80%{transform:translate(-50px,40px)} 100%{transform:translate(0,0)} }
  .butterfly.fly { animation: flyAround 2.4s ease-in-out; }

  /* Pip walks up to a large leaf, then returns to his spot */
  .pipwalk { transform-box: fill-box; transform-origin: 50% 50%; cursor: pointer; }
  @keyframes walkToLeaf { 0%{transform:translate(0,0)} 40%{transform:translate(360px,-120px)} 55%{transform:translate(360px,-120px)} 100%{transform:translate(0,0)} }
  .pipwalk.walk { animation: walkToLeaf 2.4s ease-in-out; }

  /* Bugs playing tag */
  @keyframes tag { 0%{transform:translate(0,0)} 25%{transform:translate(60px,20px)} 50%{transform:translate(-40px,50px)} 75%{transform:translate(30px,-30px)} 100%{transform:translate(0,0)} }
  .tag { animation: tag 3s ease-in-out infinite; }

  /* Pip's hand pops up, waves, then tucks back down */
  .hand { transform-box: fill-box; transform-origin: 50% 100%; opacity: 0; transform: translateY(18px) scale(.8); cursor: pointer; }
  @keyframes handPopWave {
    0%{opacity:0; transform:translateY(18px) scale(.8)}
    8%{opacity:1; transform:translateY(0) scale(1)}
    20%{transform:rotate(-20deg)}
    35%{transform:rotate(20deg)}
    50%{transform:rotate(-16deg)}
    65%{transform:rotate(14deg)}
    78%{transform:rotate(-6deg)}
    86%{opacity:1; transform:rotate(0)}
    100%{opacity:0; transform:translateY(18px) scale(.8)}
  }
  .hand.wave { animation: handPopWave 2.4s ease-in-out; }
</style>

  // ---------- Audio (Web Audio API, synthesized) ----------
  var ac = null;
  function initAudio(){
    if(!ac){ var AC = window.AudioContext || window.webkitAudioContext; if(AC) ac = new AC(); }
    if(ac && ac.state === 'suspended'){ try{ ac.resume(); }catch(e){} }
  }
  function tone(type,f0,f1,t,dur,vol){
    initAudio(); if(!ac) return;
    var o = ac.createOscillator(); var g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(Math.max(1,f0), t);
    if(f1 && f1>0){ o.frequency.exponentialRampToValueAtTime(Math.max(1,f1), t+dur); }
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+0.06);
  }
  function noise(t,dur,vol,filterType,freq){
    initAudio(); if(!ac) return;
    var sr = ac.sampleRate; var buf = ac.createBuffer(1, Math.floor(sr*dur), sr);
    var d = buf.getChannelData(0); for(var i=0;i<d.length;i++){ d[i] = Math.random()*2-1; }
    var src = ac.createBufferSource(); src.buffer = buf;
    var f = ac.createBiquadFilter(); f.type = filterType; f.frequency.value = freq;
    var g = ac.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(f).connect(g).connect(ac.destination); src.start(t); src.stop(t+dur+0.06);
  }

  function playClick(){ initAudio(); if(!ac) return; var t = ac.currentTime;
    tone('triangle',660,990,t,0.09,0.30);
    tone('triangle',1320,990,t+0.05,0.06,0.12);
    noise(t,0.05,0.06,'highpass',2000);
  }
  function pluck(t,freq,dur,vol){
    initAudio(); if(!ac) return;
    var o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(freq*1.6, t);
    o.frequency.exponentialRampToValueAtTime(freq, t+0.05);
    var f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 9;
    var g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(f).connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+0.06);
  }
  function playSun(){ initAudio(); if(!ac) return; var t = ac.currentTime;
    var notes=[660,880,1100,1320];
    for(var i=0;i<notes.length;i++){ tone('triangle',notes[i],notes[i]*1.25,t+i*0.07,0.22,0.13); }
    noise(t,0.22,0.06,'highpass',3000);
  }
  function playAcorn(){ initAudio(); if(!ac) return; var t = ac.currentTime;
    noise(t,0.03,0.17,'highpass',3500);            // crisp click
    pluck(t,520,0.4,0.5);                          // satisfying pluck
    pluck(t+0.02,780,0.32,0.22);                   // harmonic overtone
    tone('sine',180,52,t+0.24,0.36,0.27);          // thud
    noise(t+0.24,0.22,0.09,'lowpass',420);         // rustle
  }
  function blub(t,dur){
    initAudio(); if(!ac) return;
    var o=ac.createOscillator(); o.type='sine'; o.frequency.value=112;
    var f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=520;
    var g=ac.createGain();
    var lfo=ac.createOscillator(); lfo.type='sine'; lfo.frequency.value=9;
    var lg=ac.createGain(); lg.gain.value=30; lfo.connect(lg).connect(o.frequency);
    var amp=ac.createOscillator(); amp.type='sine'; amp.frequency.value=6;
    var ag=ac.createGain(); ag.gain.value=0.32; amp.connect(ag).connect(g.gain);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.42,t+0.05);
    g.gain.linearRampToValueAtTime(0.28,t+dur-0.06); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(f).connect(g).connect(ac.destination);
    o.start(t); lfo.start(t); amp.start(t);
    o.stop(t+dur+0.06); lfo.stop(t+dur+0.06); amp.stop(t+dur+0.06);
  }
  function crunch(t,dur){
    initAudio(); if(!ac) return;
    noise(t,0.12,0.34,'highpass',3000);
    tone('square',1800,900,t,0.12,0.2);
    noise(t+0.02,0.18,0.16,'bandpass',800);
    tone('sine',150,60,t+0.02,0.24,0.26);
  }
  function playRumble(){ initAudio(); if(!ac) return; var t=ac.currentTime;
    // low belly rumble underneath
    var o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=48;
    var f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=160; f.Q.value=4;
    var g=ac.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.22,t+0.15); g.gain.linearRampToValueAtTime(0.16,t+0.8); g.gain.exponentialRampToValueAtTime(0.0001,t+1.0);
    o.connect(f).connect(g).connect(ac.destination); o.start(t); o.stop(t+1.06);
    // gurgle-gurgle-crunch
    blub(t+0.05,0.3);
    blub(t+0.35,0.28);
    crunch(t+0.62,0.36);
  }
  function playPage(){ initAudio(); if(!ac) return; var t = ac.currentTime;
    noise(t,0.28,0.13,'bandpass',900);
    tone('sine',440,660,t+0.05,0.14,0.10);
  }
  function playBuzz(){ initAudio(); if(!ac) return; var t = ac.currentTime; var dur = 0.5;
    var o = ac.createOscillator(); o.type='sawtooth'; o.frequency.value = 95;
    var f = ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 650;
    var g = ac.createGain();
    var tr = ac.createOscillator(); tr.type='sine'; tr.frequency.value = 9;
    var tg = ac.createGain(); tg.gain.value = 0.25; tr.connect(tg).connect(g.gain);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.22,t+0.05); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(f).connect(g).connect(ac.destination); o.start(t); tr.start(t); o.stop(t+dur); tr.stop(t+dur);
  }
  function playRain(){ initAudio(); if(!ac) return; var t = ac.currentTime;
    noise(t,1.3,0.14,'highpass',1200);
    for(var i=0;i<6;i++){ tone('sine',900,1500,t+0.12*i+Math.random()*0.05,0.08,0.11); }
  }
  function playChime(){ initAudio(); if(!ac) return; var t = ac.currentTime;
    var notes=[523,659,784]; for(var i=0;i<notes.length;i++){ tone('sine',notes[i],notes[i],t+i*0.18,0.7,0.16); }

    tone('square',1200,900,t,0.12,0.2);

  }
  function playWave(){ initAudio(); if(!ac) return; var t = ac.currentTime;
    tone('sine',440,440,t,0.32,0.16);
    tone('sine',550,550,t+0.18,0.3,0.14);
  }
  function playWalk(){ initAudio(); if(!ac) return; var t=ac.currentTime;
    tone('sine',180,140,t,0.12,0.14);
    tone('sine',180,140,t+0.22,0.12,0.14);
    tone('sine',180,140,t+0.44,0.12,0.14);
  }
  function playCrunch(){ initAudio(); if(!ac) return; var t=ac.currentTime;
    // short crackling crunch
    noise(t,0.09,0.42,'highpass',2200);
    noise(t+0.05,0.06,0.3,'bandpass',1600);
    noise(t+0.11,0.05,0.22,'highpass',3000);
    noise(t+0.16,0.05,0.16,'bandpass',900);
    tone('sine',160,80,t,0.16,0.16);
  }
  function playThunder(){ initAudio(); if(!ac) return; var t=ac.currentTime;
    noise(t,0.15,0.4,'highpass',2500);
    var o=ac.createOscillator(); o.type='sawtooth'; o.frequency.value=45;
    var f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=140; f.Q.value=3;
    var g=ac.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.28,t+0.1); g.gain.exponentialRampToValueAtTime(0.0001,t+1.0);
    o.connect(f).connect(g).connect(ac.destination); o.start(t); o.stop(t+1.05);
    noise(t+0.1,0.5,0.12,'lowpass',500);
  }
  function playStarFall(){ initAudio(); if(!ac) return; var t=ac.currentTime;
    tone('sine',880,440,t,0.5,0.14);
    tone('sine',660,330,t+0.3,0.4,0.10);
  }

  // ---------- Cover interactions ----------
  // Pip: wiggle + tummy rumble (cover and all pages)
  document.addEventListener('click', function(e){
    var p = e.target.closest ? e.target.closest('.pip-wrap') : null;
    if(!p) return;
    e.preventDefault(); playRumble();
    p.classList.remove('wiggle'); void p.offsetWidth; p.classList.add('wiggle');
    setTimeout(function(){ p.classList.remove('wiggle'); },900);
  });
  // Bugs in the tree: chirp + wiggle on tap
  document.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.bug') : null;
    if(!b) return;
    e.preventDefault(); playChirp();
    b.classList.remove('bwiggle'); void b.offsetWidth; b.classList.add('bwiggle');
    setTimeout(function(){ b.classList.remove('bwiggle'); },600);
  });
  // Pip's face (page 1): hand pops up and waves
  var pipFace = document.getElementById('pipFace');
  var pipHand = document.getElementById('pipHand');
  if(pipFace){ pipFace.addEventListener('click', function(e){ e.preventDefault(); playWave();
    if(pipHand){ pipHand.classList.remove('wave'); void pipHand.offsetWidth; pipHand.classList.add('wave');
      setTimeout(function(){ pipHand.classList.remove('wave'); },2500); }
  }); }
  // Spider: drops down on its web and comes back up
  var spiderG = document.getElementById('spiderG');
  var spiderWeb = document.getElementById('spiderWeb');
  if(spiderG){ spiderG.addEventListener('click', function(e){ e.preventDefault(); playBoing();
    spiderG.classList.remove('drop'); void spiderG.offsetWidth; spiderG.classList.add('drop');
    if(spiderWeb){ spiderWeb.classList.remove('show'); void spiderWeb.offsetWidth; spiderWeb.classList.add('show'); }
    setTimeout(function(){ spiderG.classList.remove('drop'); if(spiderWeb) spiderWeb.classList.remove('show'); },1850);
  }); }
  // Firefly: flies in a circle on tap
  document.addEventListener('click', function(e){
    var f = e.target.closest ? e.target.closest('.firefly') : null;
    if(!f) return;
    e.preventDefault(); playChirp();
    f.classList.remove('flycircle'); void f.offsetWidth; f.classList.add('flycircle');
    setTimeout(function(){ f.classList.remove('flycircle'); },1550);
  });

  var acorns = document.querySelectorAll('#cover .acorn');
  Array.prototype.forEach.call(acorns, function(a){
    a.addEventListener('click', function(e){ e.preventDefault(); playAcorn();
      a.classList.remove('respawn','falling');
      void a.offsetWidth; a.classList.add('falling');
      setTimeout(function(){ a.classList.remove('falling'); a.classList.add('respawn');
        setTimeout(function(){ a.classList.remove('respawn'); },650);
      },730);
    });
  });

  // Sun: rays pop out (cover + pages)
  document.addEventListener('click', function(e){
    var sw = e.target.closest ? e.target.closest('.sun-wrap') : null;
    if(!sw) return;
    e.preventDefault(); playSun();
    var r = sw.querySelector('.sun-rays');
    if(r){ r.classList.remove('on'); void r.offsetWidth; r.classList.add('on');
      setTimeout(function(){ r.classList.remove('on'); }, 1600); }
  });
  // Clouds: rain on tap (cover + pages)
  function rainFromCloud(g){
    g.classList.add('raining'); playRain();
    setTimeout(function(){ g.classList.remove('raining'); }, 2800);
  }
  document.addEventListener('click', function(e){
    var cw = e.target.closest ? e.target.closest('.cloud-wrap') : null;
    if(!cw) return;
    e.preventDefault(); rainFromCloud(cw);
  });
  // Butterfly: flies around on tap
  // Ladybug (page 2): flies in a circle on tap
  var dotFly = document.getElementById('dotFly');
  if(dotFly){ dotFly.addEventListener('click', function(e){ e.preventDefault(); playChirp();
    dotFly.classList.remove('flycircle'); void dotFly.offsetWidth; dotFly.classList.add('flycircle');
    setTimeout(function(){ dotFly.classList.remove('flycircle'); },1550);
  }); }
  // Pip (page 3): walks up to the large leaf, then returns (can replay)
  var pipWalk = document.getElementById('pipWalk');
  if(pipWalk){ pipWalk.addEventListener('click', function(e){ e.preventDefault(); playWalk();
    pipWalk.classList.remove('walk'); void pipWalk.offsetWidth; pipWalk.classList.add('walk');
    setTimeout(function(){ pipWalk.classList.remove('walk'); },2450);
  }); }
  // Pip walks over to a clicked leaf and eats it (pages 4 & 5)
  var pipBite = document.getElementById('pipBite');
  var bigLeaf = document.getElementById('bigLeaf');
  var pipNibble = document.getElementById('pipNibble');
  var wideLeaf = document.getElementById('wideLeaf');
  function walkPipTo(use, tx, ty, done){
    if(!use){ if(done) done(); return; }
    var sx = parseFloat(use.getAttribute('x') || 200);
    var sy = parseFloat(use.getAttribute('y') || 300);
    var t0 = performance.now(), dur = 900;
    function step(now){
      var t = Math.min(1, (now-t0)/dur);
      var e = t < 0.5 ? 2*t*t : 1 - 2*(1-t)*(1-t);
      use.setAttribute('x', (sx + (tx-sx)*e).toFixed(1));
      use.setAttribute('y', (sy + (ty-sy)*e).toFixed(1));
      if(t < 1){ requestAnimationFrame(step); } else if(done){ done(); }
    }
    requestAnimationFrame(step);
  }
  function eatLeaf(pip, leaf){
    playCrunch();
    if(pip){ pip.classList.remove('eat'); void pip.offsetWidth; pip.classList.add('eat');
      setTimeout(function(){ pip.classList.remove('eat'); },750); }
    if(leaf){ leaf.classList.add('gone'); }
  }
  document.addEventListener('click', function(e){
    var c = e.target.closest ? e.target.closest('.clickleaf') : null;
    if(c){ e.preventDefault();
      var pip = document.querySelector('.page.active .eater');
      var u = c.querySelector('use');
      var tx = u ? parseFloat(u.getAttribute('x')) : 200;
      var ty = u ? parseFloat(u.getAttribute('y')) : 300;
      if(pip){ var use = pip.querySelector('use'); walkPipTo(use, tx - 184, ty - 60, function(){ eatLeaf(pip, c); }); }
      return;
    }
    var p = e.target.closest ? e.target.closest('.pipbite') : null;
    if(p){ e.preventDefault();
      if(bigLeaf){ var bu = bigLeaf.querySelector('use'); var bx = bu ? parseFloat(bu.getAttribute('x')) : 560; var by = bu ? parseFloat(bu.getAttribute('y')) : 200; var use = p.querySelector('use'); walkPipTo(use, bx - 184, by - 60, function(){ eatLeaf(p, bigLeaf); }); }
    }
    var n = e.target.closest ? e.target.closest('.pipnibble') : null;
    if(n){ e.preventDefault();
      if(wideLeaf){ var wu = wideLeaf.querySelector('use'); var wx = wu ? parseFloat(wu.getAttribute('x')) : 560; var wy = wu ? parseFloat(wu.getAttribute('y')) : 200; var use2 = n.querySelector('use'); walkPipTo(use2, wx - 184, wy - 60, function(){ eatLeaf(n, wideLeaf); }); }
    }
  });

  // Page 5: Pip walks over to a leaf and eats it; each bite makes him grow rounder
  var pipGrow = document.getElementById('pipGrow');
  var pipGrowUse = pipGrow ? pipGrow.querySelector('use') : null;
  var p5leaves = ['leafA','leafB','leafC','leafD'].map(function(id){ return document.getElementById(id); });
  var growCount = 0;
  function p5RemoveLeaf(leaf){
    if(!leaf || leaf.classList.contains('gone')) return;
    var u = leaf.querySelector('use');
    var tx = u ? parseFloat(u.getAttribute('x')) : 520;
    var ty = u ? parseFloat(u.getAttribute('y')) : 320;
    walkPipTo(pipGrowUse, tx - 184, ty - 60, function(){
      leaf.classList.add('gone');
      growCount++;
      if(pipGrow){ pipGrow.style.transform = 'scale('+(1+growCount*0.18)+', '+(1+growCount*0.14)+')';
        pipGrow.classList.remove('eat'); void pipGrow.offsetWidth; pipGrow.classList.add('eat');
        setTimeout(function(){ pipGrow.classList.remove('eat'); },750); }
      playCrunch();
    });
  }
  document.addEventListener('click', function(e){
    var leaf = e.target.closest ? e.target.closest('.p5leaf') : null;
    if(leaf){ e.preventDefault(); p5RemoveLeaf(leaf); return; }
    var p = e.target.closest ? e.target.closest('.piggrow') : null;
    if(p){ e.preventDefault();
      var next = null;
      for(var i=0;i<p5leaves.length;i++){ if(p5leaves[i] && !p5leaves[i].classList.contains('gone')){ next = p5leaves[i]; break; } }
      if(next){ p5RemoveLeaf(next); }
    }
  });
  // Page 5 spider: drops on its web and comes back up
  var spider5 = document.getElementById('spider5');
  var spiderWeb5 = document.getElementById('spiderWeb5');
  if(spider5){ spider5.addEventListener('click', function(e){ e.preventDefault(); playBoing();
    spider5.classList.remove('drop'); void spider5.offsetWidth; spider5.classList.add('drop');
    if(spiderWeb5){ spiderWeb5.classList.remove('show'); void spiderWeb5.offsetWidth; spiderWeb5.classList.add('show'); }
    setTimeout(function(){ spider5.classList.remove('drop'); if(spiderWeb5) spiderWeb5.classList.remove('show'); },1850);
  }); }
  // Page 5 butterfly: flies backward and forward on tap
  var butterfly5 = document.getElementById('butterfly5');
  if(butterfly5){ butterfly5.addEventListener('click', function(e){ e.preventDefault(); playChirp();
    butterfly5.classList.remove('fly'); void butterfly5.offsetWidth; butterfly5.classList.add('fly');
    setTimeout(function(){ butterfly5.classList.remove('fly'); },1650);
  }); }
  // Page 5 clouds: make it dark, rain, and lightning
  function stormOn(){
    playThunder(); playRain();
    var ov = document.getElementById('stormOverlay'); if(ov){ ov.classList.add('on'); }
    var li = document.getElementById('lightning'); if(li){ li.classList.remove('flash'); void li.offsetWidth; li.classList.add('flash'); }
    var sr = document.getElementById('stormRain'); if(sr){ sr.classList.add('on'); }
    setTimeout(function(){ if(li){ li.classList.remove('flash'); } },1350);
    setTimeout(function(){ if(ov){ ov.classList.remove('on'); } if(sr){ sr.classList.remove('on'); } },3500);
  }
  document.addEventListener('click', function(e){
    var sc = e.target.closest ? e.target.closest('.stormcloud') : null;
    if(sc){ e.preventDefault(); stormOn(); return; }
  });
  // Page 6 cocoon: wiggles on tap
  var cocoonG = document.getElementById('cocoonG');
  if(cocoonG){ cocoonG.addEventListener('click', function(e){ e.preventDefault(); playWave();
    cocoonG.classList.remove('wiggle'); void cocoonG.offsetWidth; cocoonG.classList.add('wiggle');
    setTimeout(function(){ cocoonG.classList.remove('wiggle'); },750);
  }); }
  // Page 6 spider: drops on its web and comes back up
  var spider6 = document.getElementById('spider6');
  var spiderWeb6 = document.getElementById('spiderWeb6');
  if(spider6){ spider6.addEventListener('click', function(e){ e.preventDefault(); playBoing();
    spider6.classList.remove('drop'); void spider6.offsetWidth; spider6.classList.add('drop');
    if(spiderWeb6){ spiderWeb6.classList.remove('show'); void spiderWeb6.offsetWidth; spiderWeb6.classList.add('show'); }
    setTimeout(function(){ spider6.classList.remove('drop'); if(spiderWeb6) spiderWeb6.classList.remove('show'); },1850);
  }); }
  // Page 6 butterfly: flies backward and forward on tap
  var butterfly6 = document.getElementById('butterfly6');
  if(butterfly6){ butterfly6.addEventListener('click', function(e){ e.preventDefault(); playChirp();
    butterfly6.classList.remove('fly'); void butterfly6.offsetWidth; butterfly6.classList.add('fly');
    setTimeout(function(){ butterfly6.classList.remove('fly'); },1650);
  }); }
  // Page 6 stars: stay still; clicking makes one fall like rain, then return
  document.addEventListener('click', function(e){
    var s = e.target.closest ? e.target.closest('.star6') : null;
    if(!s) return;
    e.preventDefault(); playStarFall();
    s.classList.remove('fall'); void s.offsetWidth; s.classList.add('fall');
    setTimeout(function(){ s.classList.remove('fall'); },3100);
  });
  // Page 7: click Pip -> turns into a butterfly, flies around, then resets
  var pip7 = document.getElementById('pip7');
  var pipfly7 = document.getElementById('pipfly7');
  if(pip7){ pip7.addEventListener('click', function(e){ e.preventDefault(); playChirp();
    pip7.classList.add('hidden');
    if(pipfly7){ pipfly7.classList.remove('fly'); void pipfly7.offsetWidth; pipfly7.classList.add('fly'); }
    setTimeout(function(){ if(pipfly7){ pipfly7.classList.remove('fly'); } pip7.classList.remove('hidden'); },3600);
  }); }

  // Title: balloon up then back to normal size
  var titleEl = document.querySelector('#cover h1.title');
  titleEl.addEventListener('click', function(e){ e.preventDefault(); playBoing();
    titleEl.classList.remove('balloon'); void titleEl.offsetWidth; titleEl.classList.add('balloon');
    setTimeout(function(){ titleEl.classList.remove('balloon'); },1000);
  });

  // Tree: rustle the leaves on tap (cover and pages)
  document.addEventListener('click', function(e){
    var t = e.target.closest ? e.target.closest('.tree-wrap') : null;
    if(!t) return;
    playRustle();
    t.classList.remove('rustle'); void t.offsetWidth; t.classList.add('rustle');
    setTimeout(function(){ t.classList.remove('rustle'); },800);
  });

  // ---------- Navigation ----------
  var pages = document.querySelectorAll('.page');
  var current = 0; // 0 = cover
  var dotsWrap = document.getElementById('dots');
  var dotEls = [];
  for(var i=0;i<7;i++){
    var d = document.createElement('div'); d.className='dot'; d.dataset.p = i+1; dotsWrap.appendChild(d); dotEls.push(d);
  }
  var backBtn = document.getElementById('backBtn');
  var nextBtn = document.getElementById('nextBtn');

  function show(n){
    current = n;
    Array.prototype.forEach.call(pages, function(p){ p.classList.remove('active'); });
    document.getElementById(n===0 ? 'cover' : 'p'+n).classList.add('active');
    Array.prototype.forEach.call(dotEls, function(d){ d.classList.toggle('on', (+d.dataset.p)===n); });
    backBtn.style.display = (n===0) ? 'none' : 'block';
    nextBtn.style.display = (n===0) ? 'none' : 'block';
    nextBtn.classList.toggle('restart', n===7);
    nextBtn.innerHTML = (n===7) ? '&#8634;' : '&#9654;';
  }

  var playBtn = document.getElementById('playBtn');
  playBtn.addEventListener('click', function(e){ e.preventDefault(); initAudio(); playClick();
    setTimeout(playPage, 90); show(1);
  });

  backBtn.addEventListener('click', function(e){ e.preventDefault(); playPage(); show(Math.max(current-1,0)); });
  nextBtn.addEventListener('click', function(e){ e.preventDefault(); playPage();
    if(current>=7){ show(0); } else { show(current+1); }
  });
  Array.prototype.forEach.call(dotEls, function(d){
    d.addEventListener('click', function(){ playPage(); show(+d.dataset.p); });
  });

  // Page-specific gentle sounds on certain pages
  function onShow(){
    if(current===3){ playBuzz(); }        // page 3: Dot buzzes
    if(current===5){ playRain(); }        // page 6: rain
    if(current===6){ playChime(); }       // page 7: goodnight chime
  }
  var origShow = show; show = function(n){ origShow(n); setTimeout(onShow, 400); };

  show(0);
})();
</script>
</body>
</html>
